<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam Quinte</title>
<meta name="description" content="Let's grow in faith together.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0A0A0A;
    --card:#111111;
    --gold:#B4BCC5;
    --gold-soft:#B8963A;
    --gold-light:#E8CF7A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;background:#000;
    font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;
  }
  .card{
    width:100%;max-width:380px;
    background:radial-gradient(120% 80% at 50% 0%,#1c1a14 0%,#0d0d0d 55%,#080808 100%);
    border:1px solid rgba(180,188,197,.4);
    border-radius:14px;
    padding:56px 30px 48px;text-align:center;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 24px 60px rgba(0,0,0,.85),0 0 40px rgba(180,188,197,.06);
  }
  .icon{
    width:100px;height:100px;margin:0 auto 28px;border-radius:50%;
    background:radial-gradient(circle at 50% 35%,#1d1b15,#0a0a0a);
    border:1px solid transparent;
    background-clip:padding-box;
    box-shadow:0 0 0 1px #9AA3AD,0 0 24px rgba(180,188,197,.2);
    display:flex;align-items:center;justify-content:center;
  }
  .icon svg{width:58px;height:58px}
  h1{
    font-family:"Cinzel",Georgia,serif;
    font-size:27px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    background:linear-gradient(180deg,#EEF1F4 0%,#B4BCC5 50%,#737D88 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .rule{width:64px;height:1px;margin:20px auto;border-radius:2px;
    background:linear-gradient(90deg,transparent,#B4BCC5,transparent)}
  .tagline{
    font-size:22px;line-height:1.4;color:#D5DAE0;
    font-style:italic;font-weight:600;margin-bottom:38px;
  }
  .btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;padding:16px;margin-top:14px;
    border-radius:10px;text-decoration:none;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:20px;font-weight:700;letter-spacing:.05em;
    border:1px solid #9AA3AD;color:#D5DAE0;background:rgba(180,188,197,.04);
    transition:all .3s ease;cursor:pointer;
  }
  .btn:hover,.btn:focus-visible{background:rgba(180,188,197,.16);transform:translateY(-1px)}
  .btn.primary{
    background:linear-gradient(180deg,#C3CAD2,#737D88);
    color:#0A0A0A;border-color:#737D88;
    box-shadow:0 6px 18px rgba(180,188,197,.2);
  }
  .btn.primary:hover,.btn.primary:focus-visible{background:linear-gradient(180deg,#EEF1F4,#9AA3AD)}
  .btn svg{width:20px;height:20px;fill:currentColor;flex:none}
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">

    <h1>Sam Quinte</h1>

</html>
